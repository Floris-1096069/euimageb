<!-- templates/_reply.html -->
<div class="post reply" id="post-{{ post.id }}">
  <p>{{ post.content }}</p>
  {% if post.image_url %}
    <img src="{{ post.image_url }}" alt="Reply image" style="max-width: 200px; max-height: 200px;">
  {% endif %}
  <small>Posted on {{ post.created_at.strftime('%Y-%m-%d %H:%M') }} by <span>Anonymous</span></small>
</div>
