<!-- templates/_reply.html -->
<div class="reply" id="reply-{{ reply.id }}">
  <p>{{ reply.content }}</p>
  {% if reply.image_url %}
    <img src="{{ reply.image_url }}" alt="Reply image" style="max-width: 200px; max-height: 200px;">
  {% endif %}
  <small>Replied on {{ reply.created_at.strftime('%Y-%m-%d %H:%M') }} by <span>Anonymous</span></small>
</div>
